name: Bug 报告
description: 应用出错了、界面不对、数据不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先确认：
        - 用的是最新版本（可在 Releases 里看）
        - 已经搜过 issue，没有重复
        - **不要粘贴 API Key、完整聊天记录或 `%APPDATA%` 里的原始文件**
  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 在 Releases 页面或安装包文件名上能看到，例如 1.0.0
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows 版本
      description: 例如 Windows 11 24H2（设置 → 系统 → 关于 里可以看）
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: 安装方式
      options:
        - 安装包（Setup.exe）
        - 便携版（Portable.exe）
        - 从源码运行（npm run dev）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 1. 打开… 2. 点击… 3. 出现…
      placeholder: |
        1. 打开主页
        2. 点某张卡的「记忆」
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图更好；截图里如果有 API Key，请先打码
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息（可选）
      description: 比如用了哪个供应商/模型、对话大概多长、是否重启后仍复现
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认内容里没有 API Key、密码或他人隐私数据
          required: true
